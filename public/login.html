<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — FoodLog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="login-shell">
  <div class="login-card">

    <!-- ===== Brand ===== -->
    <div class="login-brand">
      <div class="logo-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      </div>
      <div class="logo-name">FoodLog</div>
    </div>

    <!-- ===== Header ===== -->
    <div class="login-header">
      <h1>Welcome back</h1>
      <p>Sign in to track your household groceries, manage inventory and log food consumption.</p>
    </div>

    <!-- ===== Error message (hidden by default) ===== -->
    <div class="login-error" id="login_error" role="alert" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
      <span id="error_text">Invalid username or password, or your account has been deactivated.</span>
    </div>

    <!-- ===== Form ===== -->
    <form class="login-form" id="login_form" novalidate>

      <!-- Username -->
      <div class="field">
        <label for="login_username">Username</label>
        <input id="login_username" name="username" type="text" placeholder="e.g. john.doe" autocomplete="username" required>
      </div>

      <!-- Password -->
      <div class="field">
        <label for="login_password">Password</label>
        <div class="input-wrap">
          <input id="login_password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="pwd-toggle" id="pwd_toggle" aria-label="Show password">
            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M9.9 4.2A10.9 10.9 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19"/><path d="M6.6 6.6A18.5 18.5 0 0 0 2 11s3.5 7 10 7a10.9 10.9 0 0 0 5.4-1.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M2 2l20 20"/></svg>
          </button>
        </div>
      </div>

      <!-- Options row -->
      <div class="login-options">
        <label class="checkbox-row">
          <input type="checkbox" id="remember_me" name="remember">
          Remember me
        </label>
        <a href="#" onclick="event.preventDefault()">Forgot password?</a>
      </div>

      <!-- Submit -->
      <button class="btn btn-primary" id="login_submit" type="submit">
        Login
      </button>
    </form>

    <!-- ===== Divider ===== -->
    <div class="login-divider" role="separator" aria-label="or">
      <span>or continue with</span>
    </div>

    <!-- ===== Google sign-in ===== -->
    <button type="button" class="btn btn-secondary btn-google" id="login_google_btn">
      <svg class="g-icon" width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      <span class="g-label">Sign in with Google</span>
    </button>

    <!-- ===== Footer / register link ===== -->
    <div class="login-footer">
      <button type="button" class="register-link" id="login_register_link">
        Don&rsquo;t have an account? <b>Register</b>
      </button>
    </div>

  </div>
</div>

<script>
(function () {
  'use strict';

  var form = document.getElementById('login_form');
  var errorBox = document.getElementById('login_error');
  var errorText = document.getElementById('error_text');
  var submitBtn = document.getElementById('login_submit');

  function showError(msg) {
    errorText.textContent = msg;
    errorBox.hidden = false;
  }
  function hideError() {
    errorBox.hidden = true;
  }

  // Surface errors from Google OAuth redirects (?error=...)
  var params = new URLSearchParams(window.location.search);
  var oauthError = params.get('error');
  if (oauthError) {
    var oauthMessages = {
      google_cancelled: 'Google sign-in was cancelled. Please try again.',
      google_failed: 'Google sign-in failed. Please try again.',
      google_not_configured: 'Google sign-in is not configured on this server.',
      account_deactivated: 'Your account has been deactivated. Contact your household admin.'
    };
    showError(oauthMessages[oauthError] || 'Sign-in failed. Please try again.');
  }

  // Password visibility toggle
  var pwdInput = document.getElementById('login_password');
  var pwdToggle = document.getElementById('pwd_toggle');
  var eyeIcon = pwdToggle.querySelector('.eye-icon');
  var eyeOffIcon = pwdToggle.querySelector('.eye-off-icon');
  pwdToggle.addEventListener('click', function () {
    var show = pwdInput.type === 'password';
    pwdInput.type = show ? 'text' : 'password';
    eyeIcon.hidden = show;
    eyeOffIcon.hidden = !show;
    pwdToggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

  // Google OAuth start — RELATIVE url (app runs behind a stripped path prefix)
  document.getElementById('login_google_btn').addEventListener('click', function () {
    window.location.href = 'v1/auth/google';
  });

  // Register link
  document.getElementById('login_register_link').addEventListener('click', function () {
    window.location.href = 'register.html';
  });

  // Login submit → POST v1/auth/login
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    hideError();

    var username = document.getElementById('login_username').value.trim();
    var password = pwdInput.value;

    if (!username || !password) {
      showError('Please enter both your username and password.');
      return;
    }

    submitBtn.classList.add('is-loading');
    submitBtn.disabled = true;

    fetch('v1/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: password })
    })
      .then(function (res) {
        return res.json().then(function (data) { return { ok: res.ok, status: res.status, data: data }; });
      })
      .then(function (result) {
        if (result.ok && result.data.token) {
          localStorage.setItem('hgfl_token', result.data.token);
          localStorage.setItem('hgfl_user', JSON.stringify(result.data.user || {}));
          localStorage.removeItem('hgfl_preview');
          localStorage.removeItem('hgfl_preview_state');
          var next = new URLSearchParams(window.location.search).get('next') || '';
          window.location.href = /^(join|onboarding)\.html(\?[\w=&%.-]+)?$/.test(next) ? next : 'dashboard.html';
          return;
        }
        if (result.status === 403) {
          showError(result.data.error || 'This account has been deactivated.');
        } else {
          showError(result.data.error || 'Invalid username or password, or your account has been deactivated.');
        }
      })
      .catch(function () {
        showError('Could not reach the server. Please try again.');
      })
      .finally(function () {
        submitBtn.classList.remove('is-loading');
        submitBtn.disabled = false;
      });
  });
})();
</script>
</body>
</html>
