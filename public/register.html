<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register — FoodLog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="login-shell">
  <div class="login-card">

    <!-- ===== Brand ===== -->
    <div class="login-brand">
      <div class="logo-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      </div>
      <div class="logo-name">FoodLog</div>
    </div>

    <!-- ===== Header ===== -->
    <div class="login-header">
      <h1>Create your account</h1>
      <p>Join your household to log shopping trips, track inventory and record food consumption.</p>
    </div>

    <!-- ===== Error message (hidden by default) ===== -->
    <div class="login-error" id="reg_error" role="alert" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
      <span id="reg_error_text">Something went wrong. Please try again.</span>
    </div>

    <!-- ===== Form ===== -->
    <form class="login-form" id="register_form" novalidate>

      <!-- Full Name -->
      <div class="field">
        <label for="reg_full_name">Full Name</label>
        <input id="reg_full_name" name="full_name" type="text" placeholder="e.g. John Doe" autocomplete="name" required>
      </div>

      <!-- Email -->
      <div class="field">
        <label for="reg_email">Email</label>
        <input id="reg_email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
      </div>

      <!-- Password -->
      <div class="field">
        <label for="reg_password">Password</label>
        <div class="input-wrap">
          <input id="reg_password" name="password" type="password" placeholder="At least 8 characters, letters &amp; numbers" autocomplete="new-password" required>
          <button type="button" class="pwd-toggle" id="reg_pwd_toggle" aria-label="Show password">
            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M9.9 4.2A10.9 10.9 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19"/><path d="M6.6 6.6A18.5 18.5 0 0 0 2 11s3.5 7 10 7a10.9 10.9 0 0 0 5.4-1.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M2 2l20 20"/></svg>
          </button>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="field">
        <label for="reg_password_confirm">Confirm Password</label>
        <input id="reg_password_confirm" name="password_confirmation" type="password" placeholder="Re-enter your password" autocomplete="new-password" required>
      </div>

      <!-- Submit -->
      <button class="btn btn-primary" id="reg_submit" type="submit">
        Create Account
      </button>
    </form>

    <!-- ===== Divider ===== -->
    <div class="login-divider" role="separator" aria-label="or">
      <span>or continue with</span>
    </div>

    <!-- ===== Google sign-up ===== -->
    <button type="button" class="btn btn-secondary btn-google" id="reg_google_btn">
      <svg class="g-icon" width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      <span class="g-label">Sign up with Google</span>
    </button>

    <!-- ===== Footer / back to login ===== -->
    <div class="login-footer">
      <button type="button" class="register-link" id="reg_login_link">
        Already have an account? <b>Sign in</b>
      </button>
    </div>

  </div>
</div>

<script>
(function () {
  'use strict';

  var form = document.getElementById('register_form');
  var errorBox = document.getElementById('reg_error');
  var errorText = document.getElementById('reg_error_text');
  var submitBtn = document.getElementById('reg_submit');

  function showError(msg) {
    errorText.textContent = msg;
    errorBox.hidden = false;
  }
  function hideError() {
    errorBox.hidden = true;
  }

  // Password visibility toggle
  var pwdInput = document.getElementById('reg_password');
  var pwdToggle = document.getElementById('reg_pwd_toggle');
  var eyeIcon = pwdToggle.querySelector('.eye-icon');
  var eyeOffIcon = pwdToggle.querySelector('.eye-off-icon');
  pwdToggle.addEventListener('click', function () {
    var show = pwdInput.type === 'password';
    pwdInput.type = show ? 'text' : 'password';
    eyeIcon.hidden = show;
    eyeOffIcon.hidden = !show;
    pwdToggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

  // Google OAuth sign-up — same flow as sign-in; unknown accounts auto-created as Member
  document.getElementById('reg_google_btn').addEventListener('click', function () {
    window.location.href = 'v1/auth/google';
  });

  // Back to login
  document.getElementById('reg_login_link').addEventListener('click', function () {
    window.location.href = 'login.html';
  });

  // Register submit → POST v1/auth/register
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    hideError();

    var fullName = document.getElementById('reg_full_name').value.trim();
    var email = document.getElementById('reg_email').value.trim();
    var password = pwdInput.value;
    var passwordConfirm = document.getElementById('reg_password_confirm').value;

    // ---- Client-side validation (step_reg_validate) ----
    if (!fullName) {
      showError('Please enter your full name.');
      return;
    }
    // Full name is stored as first_name + last_name on the server
    var nameParts = fullName.split(/\s+/);
    if (nameParts.length < 2) {
      showError('Please enter both your first and last name.');
      return;
    }
    var firstName = nameParts[0];
    var lastName = nameParts.slice(1).join(' ');

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showError('Please enter a valid email address.');
      return;
    }
    if (!password || password.length < 8 || !/[A-Za-z]/.test(password) || !/[0-9]/.test(password)) {
      showError('Password is too weak: use at least 8 characters with at least one letter and one number.');
      return;
    }
    if (password !== passwordConfirm) {
      showError('Passwords do not match.');
      return;
    }

    submitBtn.classList.add('is-loading');
    submitBtn.disabled = true;

    fetch('v1/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        first_name: firstName,
        last_name: lastName,
        email: email,
        password: password,
        password_confirmation: passwordConfirm
      })
    })
      .then(function (res) {
        return res.json().then(function (data) { return { ok: res.ok, status: res.status, data: data }; });
      })
      .then(function (result) {
        if (result.ok && result.data.token) {
          localStorage.setItem('hgfl_token', result.data.token);
          localStorage.setItem('hgfl_user', JSON.stringify(result.data.user || {}));
          localStorage.removeItem('hgfl_preview');
          localStorage.removeItem('hgfl_preview_state');
          var next = new URLSearchParams(window.location.search).get('next') || '';
          var saved = sessionStorage.getItem('hgfl_join_code');
          if (/^(join|onboarding)\.html(\?[\w=&%.-]+)?$/.test(next)) window.location.href = next;
          else if (saved) window.location.href = 'join.html?code=' + encodeURIComponent(saved);
          else window.location.href = 'onboarding.html';
          return;
        }
        // Server-side validation errors: prefer the first field-level message
        var data = result.data || {};
        if (data.errors) {
          var firstKey = Object.keys(data.errors)[0];
          showError(data.errors[firstKey]);
        } else {
          showError(data.error || 'Registration failed. Please try again.');
        }
      })
      .catch(function () {
        showError('Could not reach the server. Please try again.');
      })
      .finally(function () {
        submitBtn.classList.remove('is-loading');
        submitBtn.disabled = false;
      });
  });
})();
</script>
</body>
</html>
