services:
  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: foodlog
      POSTGRES_PASSWORD: foodlog
      POSTGRES_DB: foodlog
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodlog -d foodlog"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
